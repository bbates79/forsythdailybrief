name: Daily Brief Update

on:
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect sources, weather, and publish approved items
        run: python3 scripts/pipeline.py collect
      - name: Validate with tests
        run: |
          python3 -m pip install pytest
          pytest -q
      - name: Commit generated updates when present
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then exit 0; fi
          git add data/
          git commit -m "chore: update Forsyth Daily Brief"
          git push

  # Manual approvals should be made locally or through a future protected
  # workflow; this scheduled job never approves sensitive items.
  approval-note:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Sensitive items require explicit approval before publication."
