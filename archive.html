<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Brief archive · Forsyth Daily Brief</title><style>body{margin:0;background:#0b1012;color:#edf5f3;font:16px/1.6 system-ui,sans-serif}main{max-width:850px;margin:auto;padding:50px 22px}a{color:#69d1bd}h1{font-size:clamp(36px,7vw,64px);line-height:.98;letter-spacing:-.06em}.note,.item{color:#9aaca9;border:1px solid #2a393c;padding:18px;border-radius:12px;margin:12px 0;background:#121a1d}.item h2{margin:0;font-size:21px}.item h2 a{text-decoration:none}.meta{font-size:12px;color:#71817f;margin-top:5px}</style></head><body><main><p><a href="./">← Forsyth Daily Brief</a></p><h1>Brief archive</h1><p class="note">Daily editions are preserved as dated, source-linked pages.</p><div id="list"><div class="item">Loading editions…</div></div></main><script>const esc=v=>String(v??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));fetch('data/brief-index.json').then(r=>r.json()).then(d=>{document.querySelector('#list').innerHTML=d.editions.length?d.editions.map(x=>`<article class="item"><h2><a href="${esc(x.path)}">${esc(x.date)} — ${esc(x.headline)}</a></h2><div class="meta">${esc(x.item_count)} updates · ${esc(x.source_count)} sources</div></article>`).join(''):'<div class="item">No daily editions have been published yet.</div>'}).catch(()=>{document.querySelector('#list').innerHTML='<div class="item">The archive is temporarily unavailable.</div>'})</script></main></body></html>
