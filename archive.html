<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Recent Forsyth Daily Brief updates and original articles."><title>Recent Briefs · Forsyth Daily Brief</title><style>:root{color-scheme:dark;--bg:#0b1012;--surface:#121a1d;--ink:#edf5f3;--muted:#9aaca9;--line:#2a393c;--accent:#69d1bd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,sans-serif}.shell{max-width:920px;margin:auto;padding:35px 22px 70px}a{color:var(--accent)}.top{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:18px}.brand{color:var(--ink);text-decoration:none;font-weight:780}.hero{padding:55px 0 30px}h1{font-size:clamp(40px,7vw,72px);line-height:.95;letter-spacing:-.07em;margin:10px 0}.dek{color:var(--muted);font-size:18px}.toolbar{display:flex;gap:10px;border-block:1px solid var(--line);padding:15px 0}.search{flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}.list{display:grid;gap:10px;margin-top:25px}.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}.item h2{margin:0;font-size:21px;line-height:1.15}.item h2 a{text-decoration:none}.meta{color:var(--muted);font-size:12px;margin-top:7px}.summary{color:var(--muted);margin:9px 0 0}footer{margin-top:55px;border-top:1px solid var(--line);padding-top:20px;color:var(--muted);font-size:13px}</style></head><body><main class="shell"><div class="top"><a class="brand" href="./">Forsyth Daily Brief</a><a href="./">← Home</a></div><header class="hero"><div class="meta">ARCHIVE / SOURCE-LINKED UPDATES</div><h1>Recent Briefs</h1><p class="dek">Browse recent approved updates from Forsyth County. Every item links to its source, and original FDB articles are labeled separately.</p></header><div class="toolbar"><input class="search" id="search" type="search" placeholder="Search recent updates…" aria-label="Search recent updates"></div><section class="list" id="list"><div class="item">Loading…</div></section><footer>Forsyth Daily Brief · <a href="about.html">About the project</a></footer></main><script>(()=>{const list=document.querySelector('#list'),search=document.querySelector('#search');let items=[];const esc=v=>String(v??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function render(){const q=search.value.toLowerCase().trim();const v=items.filter(x=>!q||`${x.title} ${x.summary} ${x.source} ${x.category}`.toLowerCase().includes(q));list.innerHTML=v.length?v.map(x=>`<article class="item"><h2><a href="${esc(x.link||'#')}" target="_blank" rel="noopener">${esc(x.title)}</a></h2><div class="meta">${esc(x.date||'')} · ${esc(x.source||'')} · ${esc(x.category||'')}</div><p class="summary">${esc(x.summary||'')}</p></article>`).join(''):'<div class="item">No updates match your search.</div>'}fetch('data/current.json').then(r=>r.json()).then(d=>{items=d.items||[];render()}).catch(()=>{list.innerHTML='<div class="item">The archive is temporarily unavailable.</div>'});search.oninput=render})()</script></body></html>
